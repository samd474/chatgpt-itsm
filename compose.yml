     # VITE_API_BASE_URL: http://localhost:8000/api
    #volumes:
     # - ./frontend:/app
     # - /app/node_modules
    #ports:
     # - "5173:5173"
    #depends_on:
     # - backend
  
volumes:
  postgres_data: 
  redis_data: 
  media_data: 