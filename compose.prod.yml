# Production stack. NGINX on the host (or a separate proxy) terminates TLS,
# serves frontend/dist and proxies /api and /admin to 127.0.0.1:8000.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Set REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0 in .env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      CLAMAV_HOST: clamav
      ATTACHMENT_SCAN_REQUIRED: "1"
    volumes:
      - media_data:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l INFO
    volumes:
      - media_data:/app/media
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  redis_data:
  media_data:
  clamav_data:
