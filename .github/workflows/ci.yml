name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: itsm
          POSTGRES_USER: itsm_app
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itsm_app -d itsm" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "1"
      POSTGRES_DB: itsm
      POSTGRES_USER: itsm_app
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements-dev.txt pip-audit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - run: python manage.py check
      - name: Deployment security checks
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-with-enough-length-to-satisfy-the-deploy-check-0123456789
          POSTGRES_PASSWORD: ci-password
          DJANGO_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f backend/Dockerfile.prod backend
