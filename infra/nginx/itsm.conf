server {
    listen 80;
    server_name itsm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name itsm.example.com;

    ssl_certificate     /etc/letsencrypt/live/itsm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itsm.example.com/privkey.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    root /srv/itsm/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:8000;
        allow 127.0.0.1;
        deny all;
    }

    location /media/ {
        # Attachments are served only through the authorized API download endpoint.
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
